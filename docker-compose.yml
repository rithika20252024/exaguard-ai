services:
  exaguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exaguard-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTO_FALLBACK_SQLITE=True
      - SQLITE_DB_PATH=/app/data/exaguard_local.db
      - EXASOL_HOST=${EXASOL_HOST:-localhost}
      - EXASOL_PORT=${EXASOL_PORT:-8563}
      - EXASOL_USER=${EXASOL_USER:-sys}
      - EXASOL_PASSWORD=${EXASOL_PASSWORD:-exasol}
      - EXASOL_SCHEMA=${EXASOL_SCHEMA:-EXAGUARD}
      - EXASOL_ENCRYPTION=${EXASOL_ENCRYPTION:-False}
      - MAX_COST_PER_CALL_USD=${MAX_COST_PER_CALL_USD:-0.25}
      - MAX_PROMPT_TOKENS=${MAX_PROMPT_TOKENS:-4096}
    volumes:
      - exaguard_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  exaguard_data:
    driver: local
