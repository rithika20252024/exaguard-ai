[project]
name = "exaguard-ai"
version = "1.0.0"
description = "Enterprise AI Agent Observability & Real-Time Governance Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyexasol>=0.25.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "backend.server:app"
